[project]
name = "catalogue-visual-search"
version = "0.1.0"
description = "Visual search over ~400,000-image fashion catalogue — upload a photo, get visually similar products with plain-English explanations. FastAPI, CLIP-style embeddings, ~23 ms search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.13.0",
    "bcrypt>=5.0.0",
    "datasets>=5.0.1",
    "fastapi[standard]>=0.136.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "motor>=3.7.1",
    "open-clip-torch>=3.3.0",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "sentencepiece>=0.2.2",
    "starlette>=1.0.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "uvicorn>=0.44.0",
    "uvloop>=0.22.1",
    "watchfiles>=1.1.1",
    "websockets>=16.0",
]
